# General
sonar.organization=antoinezanardi
sonar.projectKey=antoinezanardi_goat-it-web-admin
sonar.projectDescription=Goat It Web Admin is an intuitive admin UI to manage questions, themes, and games for the Goat It app.
sonar.links.homepage=https://github.com/antoinezanardi/goat-it-web-admin
sonar.links.ci=https://github.com/antoinezanardi/goat-it-web-admin/actions
sonar.links.issue=https://github.com/antoinezanardi/goat-it-web-admin/issues
sonar.links.scm=https://github.com/antoinezanardi/goat-it-web-admin

# Sources
sonar.sources=app/
sonar.exclusions=node_modules/**/*, dist/**/*, **/*.spec.ts, app/plugins/**/*

# Tests
sonar.tests=app/
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=tests/unit/coverage/lcov.info

# Coverage
sonar.coverage.exclusions=nuxt.config.ts, **/*.constants.ts, **/*.types.ts, **/*.enums.ts, app/plugins/**/*

# Duplication
sonar.cpd.exclusions=**/*.constants.ts

# Encodings
sonar.sourceEncoding=UTF-8